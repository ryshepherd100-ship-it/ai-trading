name: Trading bot


on:
  schedule:
    # Check every 5 min across US market hours in both summer and winter time.
    # daily_check.py uses Alpaca's market clock; closed-market runs exit without trading.
    - cron: "*/5 13-21 * * 1-5"→ Runs every 5 minutes, between 13:00 and 21:59, Monday through Friday

  workflow_dispatch: {}


jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daily_check.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
